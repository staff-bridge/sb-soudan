<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相談会のお申し込み｜スタッフブリッジ就活相談会</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5E1F8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<style>
.page { padding: 24px 0 0; display: flex; flex-direction: column; gap: 22px; }
.page h1 { font-size: clamp(23px, 6vw, 28px); }
.summary { background: var(--pink-bg); border-radius: var(--radius); padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; }
.summary b { font-family: var(--display); color: var(--plum); }
.summary span { font-size: 14px; color: var(--muted); }

form { display: flex; flex-direction: column; gap: 22px; }
fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
legend { font-family: var(--display); color: var(--plum); font-weight: 700; font-size: 18px; padding: 0; margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.req, .opt { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; line-height: 1.6; }
.req { background: var(--pink); color: #fff; }
.opt { background: var(--line); color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--fg);
  background: #fff; border: 2px solid var(--line); border-radius: 12px;
  padding: 12px 14px; min-height: 52px; appearance: none; -webkit-appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--plum) 50%), linear-gradient(135deg, var(--plum) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
textarea { min-height: 120px; resize: vertical; line-height: 1.7; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sky); }
.invalid { border-color: var(--pink) !important; background: #FFF7FA !important; }
.err { color: #C0306E; font-size: 13px; font-weight: 500; }

.wish { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.wish .row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 8px; }
.wish .lbl { font-weight: 500; font-size: 14px; display: flex; gap: 8px; align-items: center; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; }
.choice span {
  display: flex; align-items: center; justify-content: center; min-height: 56px;
  border: 2px solid var(--line); border-radius: 14px; background: #fff;
  font-weight: 500; cursor: pointer;
}
.choice input:checked + span { border-color: var(--pink); background: var(--pink-bg); color: #A8306F; }
.choice input:focus-visible + span { outline: 3px solid var(--sky); outline-offset: 2px; }

.privacy { background: var(--surface); border-radius: var(--radius); padding: 16px 18px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
.agree { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; font-size: 15px; cursor: pointer; }
.agree input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--pink); flex: none; }

.testmode { background: #FFF6DA; color: #6B4E00; border-radius: 12px; padding: 10px 14px; font-size: 13px; }
.thanks { text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; padding-top: 24px; }
.thanks .illust { width: 100%; aspect-ratio: 16 / 10; }
.thanks p { text-align: left; }
</style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a href="./"><img class="logo" src="img/logo-white.svg" alt="スタッフブリッジ" width="84" height="34"></a>
    <span class="tagline">就活相談会</span>
  </div>
</header>

<main class="container">
  <section class="page" id="form-view">
    <h1>相談会のお申し込み</h1>
    <div class="summary" id="summary" hidden>
      <b id="sum-type"></b>
      <span id="sum-detail"></span>
    </div>
    <p class="testmode" id="testmode" hidden>テストモード：送信先のGoogleフォームがまだ設定されていないため、送信しても実際には届きません。</p>

    <form id="entry" novalidate>
      <fieldset>
        <legend>あなたについて</legend>
        <div class="field">
          <label for="name">お名前 <span class="req">必須</span></label>
          <input type="text" id="name" name="name" autocomplete="name" placeholder="山田 花子" required>
        </div>
        <div class="field">
          <label for="kana">ふりがな <span class="req">必須</span></label>
          <input type="text" id="kana" name="kana" placeholder="やまだ はなこ" required>
        </div>
        <div class="field">
          <label for="email">メールアドレス <span class="req">必須</span></label>
          <input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="hanako@example.com" required>
          <span class="hint">日程のご連絡をお送りします。</span>
        </div>
        <div class="field">
          <label for="tel">電話番号 <span class="req">必須</span></label>
          <input type="tel" id="tel" name="tel" autocomplete="tel" inputmode="tel" placeholder="090-1234-5678" required>
        </div>
        <div class="field">
          <label for="school">学校名 <span class="req">必須</span></label>
          <input type="text" id="school" name="school" placeholder="〇〇大学 ／ 〇〇専門学校" required>
        </div>
        <div class="field">
          <label for="grad">卒業予定 <span class="req">必須</span></label>
          <select id="grad" name="grad" required>
            <option value="">選んでください</option>
            <option>2027年3月</option>
            <option>2027年9月</option>
            <option>2028年3月</option>
            <option>2029年3月</option>
            <option>その他・既卒</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>希望の日時と参加方法</legend>
        <p class="hint" style="margin:-8px 0 0">ご都合のよい日時を教えてください。担当者から日程確定のご連絡をします。</p>
        <div class="wish" data-wish="1">
          <span class="lbl">第1希望 <span class="req">必須</span></span>
          <div class="row">
            <input type="date" id="wish1-date" aria-label="第1希望の日付">
            <select id="wish1-time" aria-label="第1希望の時間帯"></select>
          </div>
        </div>
        <div class="wish" data-wish="2">
          <span class="lbl">第2希望 <span class="opt">任意</span></span>
          <div class="row">
            <input type="date" id="wish2-date" aria-label="第2希望の日付">
            <select id="wish2-time" aria-label="第2希望の時間帯"></select>
          </div>
        </div>
        <div class="wish" data-wish="3">
          <span class="lbl">第3希望 <span class="opt">任意</span></span>
          <div class="row">
            <input type="date" id="wish3-date" aria-label="第3希望の日付">
            <select id="wish3-time" aria-label="第3希望の時間帯"></select>
          </div>
        </div>
        <div class="field">
          <span class="lbl" id="method-lbl">参加方法 <span class="req">必須</span></span>
          <div class="choices" role="radiogroup" aria-labelledby="method-lbl" id="method-box">
            <label class="choice"><input type="radio" name="method" value="来社"><span>来社</span></label>
            <label class="choice"><input type="radio" name="method" value="オンライン"><span>オンライン</span></label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>相談したいこと</legend>
        <div class="field">
          <label for="message">事前に伝えておきたいこと <span class="opt">任意</span></label>
          <textarea id="message" name="message" placeholder="空欄でも大丈夫です。気になっていることがあれば、ひとことでも。"></textarea>
        </div>
      </fieldset>

      <div class="privacy">
        <p>いただいた情報は、相談会のご連絡と日程の調整にのみ使用します。くわしくは<a id="privacy-link" href="https://www.staff-b.com/privacy_reg/" target="_blank" rel="noopener">プライバシーポリシー</a>をご確認ください。</p>
        <label class="agree"><input type="checkbox" id="agree">プライバシーポリシーに同意する</label>
      </div>

      <p class="err" id="form-err" hidden></p>
      <button class="btn block" type="submit" id="submit">この内容で申し込む</button>
    </form>
  </section>

  <section class="thanks" id="thanks-view" hidden>
    <h1>お申し込みありがとうございます</h1>
    <div class="illust" data-img="thanks.svg"></div>
    <p id="thanks-msg"></p>
    <a class="btn" href="./">トップにもどる</a>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>運営：スタッフブリッジ ／ <a href="https://www.staff-b.com/privacy_reg/" target="_blank" rel="noopener">プライバシーポリシー</a></p>
  </div>
</footer>

<script src="js/content.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/entry.js"></script>
</body>
</html>
